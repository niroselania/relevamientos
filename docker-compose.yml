services:
  relevamiento-tech:
    build: .
    image: relevamiento-tech:latest
    container_name: relevamiento-tech
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DATA_DIR: /data
    volumes:
      - relevamiento_data:/data
volumes:
  relevamiento_data:
