services:
  relevamiento-tech:
    build: .
    image: relevamiento-tech:latest
    container_name: relevamiento-tech
    restart: unless-stopped
    ports:
      - "18088:8080"
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DATA_DIR: /data
    volumes:
      - relevamiento_data:/data
  sistemarelevamiento_bot:
    build: .
    image: relevamiento-tech:latest
    container_name: sistemarelevamiento_bot
    command: ["python", "bot.py"]
    restart: unless-stopped
    depends_on:
      relevamiento-tech:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Cargá el token del bot de Telegram en las variables del stack}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:-}
      DATA_DIR: /data
    volumes:
      - relevamiento_data:/data
volumes:
  relevamiento_data:
